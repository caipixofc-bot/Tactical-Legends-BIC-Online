<!doctype html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

canvas{display:block;width:100%;height:100%}

.row{display:flex;align-items:center;gap:7px;margin:5px 0;font-weight:800;font-size:13px}
.hp{height:6px;border:1px solid #12377f;flex:1}.hp i{display:block;height:100%;background:#12377f}
#map{right:14px;top:105px;width:165px;height:145px;padding:7px}

.msg b{font-weight:900}
#chatbar{display:flex;gap:5px;pointer-events:auto}
#chatbar input{width:100%;border:2px solid #12377f;border-radius:7px;padding:8px;background:#fff;font-weight:700;color:#102a72}
#chatbar button{border:2px solid #12377f;background:#fff;border-radius:7px;font-weight:900;color:#102a72}
#joy{left:22px;bottom:18px;width:150px;height:150px;border:3px solid #12377f;border-radius:50%;pointer-events:auto;background:rgba(18,55,127,.03)}
#knob{position:absolute;width:62px;height:62px;border:3px solid #12377f;border-radius:50%;left:41px;top:41px;background:rgba(18,55,127,.08)}
.action{position:absolute;border:3px solid #12377f;border-radius:50%;background:#fff;color:#102a72;font-weight:900;pointer-events:auto;display:flex;align-items:center;justify-content:center;user-select:none}
#fire{right:24px;bottom:42px;width:120px;height:120px;font-size:18px}
#reload{right:150px;bottom:150px;width:70px;height:70px;font-size:12px}
#aim{right:55px;bottom:180px;width:74px;height:74px;font-size:12px}
#dash{right:240px;bottom:150px;width:70px;height:70px;font-size:12px}
#login{position:fixed;inset:0;background:#fdfcf8;display:flex;align-items:center;justify-content:center;z-index:20}
#loginbox{width:min(92vw,420px);border:4px solid #12377f;border-radius:16px;padding:25px;box-shadow:7px 7px 0 rgba(18,55,127,.12);transform:rotate(-.5deg)}
#loginbox h1{font-size:32px;margin:0 0 5px}.ink{font-family:"Comic Sans MS","Bradley Hand",cursive}
#loginbox p{margin:8px 0 20px;font-weight:700}
#name{width:100%;padding:14px;border:3px solid #12377f;border-radius:8px;font-size:18px;font-weight:800}
#start{margin-top:12px;width:100%;padding:14px;border:3px solid #12377f;background:#fff;border-radius:8px;font-size:18px;font-weight:900;color:#102a72}
#hint{margin-top:15px;font-size:12px;line-height:1.35}
@media(max-width:650px){
 #brand{font-size:15px}.panel{border-width:2px;padding:7px 9px}
 #profile{width:135px}.score{font-size:18px;padding:4px 9px}
 #players{top:82px;width:155px}.row{font-size:10px}
 #map{top:82px;width:125px;height:110px}
 #chat{width:230px;height:135px;bottom:82px}
 #joy{width:130px;height:130px}.knob{width:54px;height:54px}
 #fire{width:100px;height:100px}.small{font-size:9px}
}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas></div>
<div class="ui">
  <div id="brand" class="panel ink">TACTICAL<br>LEGENDS</div>
  <div id="top"><div class="score">2</div><div class="panel" style="position:static;text-align:center">01:24<br><span class="small">ROUND 4/7</span></div><div class="score">1</div></div>
  <div id="profile" class="panel"><b id="pname">PLAYER</b><br><span class="small">LEVEL <span id="lvl">1</span> · <span id="xp">0</span> XP</span><div class="bar"><i id="xpbar"></i></div><span class="small">K <span id="kills">0</span> · W <span id="wins">0</span></span></div>
  <div id="players" class="panel"><b>SQUAD / MATCH</b><div id="plist"></div></div>
  <div id="map" class="panel"><canvas id="mini" width="145" height="120"></canvas><div class="small" style="text-align:center">ZONA A</div></div>
  <div id="chat" class="panel"><b>CHAT ONLINE</b><div id="messages"></div><div id="chatbar"><input id="chatinput" maxlength="180" placeholder="Escribe..."><button id="send">➤</button></div></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="fire" class="action">FUEGO</div><div id="reload" class="action">RECARGA</div><div id="aim" class="action">AIM</div><div id="dash" class="action">DASH</div>
</div>
<div id="login"><div id="loginbox"><h1 class="ink">TACTICAL LEGENDS</h1><p>Online · dibujado a boli BIC · shooter móvil</p><input id="name" maxlength="18" placeholder="Tu nombre"><button id="start">ENTRAR EN LA PARTIDA</button><div id="status" class="small" style="margin-top:10px;font-weight:900;letter-spacing:.5px">CONECTANDO...</div><button id="retry" style="display:none;margin-top:8px;width:100%;padding:12px;border:3px solid #12377f;background:#fff;border-radius:8px;font-size:15px;font-weight:900;color:#102a72">REINTENTAR</button><div id="hint">Tu nivel, XP, bajas, muertes y victorias se guardan en el servidor. El chat es en tiempo real.</div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),mini=document.getElementById('mini'),mx=mini.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();

const world={w:1600,h:950};
const walls=[
{x:80,y:170,w:290,h:55},{x:430,y:120,w:260,h:55},{x:760,y:180,w:300,h:55},{x:1130,y:120,w:300,h:55},
{x:170,y:290,w:55,h:250},{x:370,y:300,w:180,h:45},{x:660,y:300,w:50,h:260},{x:820,y:330,w:240,h:45},
{x:1160,y:290,w:55,h:280},{x:1320,y:360,w:180,h:45},{x:260,y:650,w:300,h:55},{x:650,y:610,w:240,h:55},
{x:1010,y:650,w:320,h:55},{x:1120,y:760,w:55,h:130},{x:430,y:770,w:55,h:120}
];
const crates=[{x:90,y:570,w:120,h:75},{x:560,y:430,w:100,h:70},{x:900,y:510,w:115,h:70},{x:1390,y:570,w:105,h:75},{x:720,y:770,w:100,h:65}];
let me={id:null,x:800,y:500,angle:0,hp:100,score:0},players=new Map(),profile=null;
let keys={up:0,down:0,left:0,right:0},stick={x:0,y:0},firing=false,ammo=30;
const joyEl=document.getElementById('joy'),nameInput=document.getElementById('name'),statusEl=document.getElementById('status'),retryBtn=document.getElementById('retry');
const login=document.getElementById('login'),start=document.getElementById('start'),send=document.getElementById('send'),chatinput=document.getElementById('chatinput'),messages=document.getElementById('messages'),plist=document.getElementById('plist'),lvl=document.getElementById('lvl'),xp=document.getElementById('xp'),xpbar=document.getElementById('xpbar'),kills=document.getElementById('kills'),wins=document.getElementById('wins'),fire=document.getElementById('fire'),reload=document.getElementById('reload'),aim=document.getElementById('aim'),dash=document.getElementById('dash'),knob=document.getElementById('knob');
const socket=io();

function inkLine(x1,y1,x2,y2,w=2){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function roughLine(x1,y1,x2,y2,w=2,alpha=1){
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1);
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  ctx.quadraticCurveTo(mx+(y2-y1)*0.012,my-(x2-x1)*0.012,x2,y2);
  ctx.stroke(); ctx.restore();
}
function hatchRect(x,y,w,h,step=12,density=1){
  ctx.save(); ctx.globalAlpha=.28; ctx.lineWidth=1.2;
  for(let i=-h;i<w;i+=step){
    ctx.beginPath(); ctx.moveTo(x+i,y+h); ctx.lineTo(x+i+h*density,y); ctx.stroke();
  }
  ctx.restore();
}
function sketchBuilding(b){
  ctx.save(); ctx.strokeStyle='#163b82'; ctx.fillStyle='#fff'; ctx.lineWidth=3;
  ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeRect(b.x,b.y,b.w,b.h);
  // facade bricks / boards
  ctx.lineWidth=1.4; ctx.globalAlpha=.55;
  for(let yy=b.y+12; yy<b.y+b.h-8; yy+=18){
    roughLine(b.x+4,yy,b.x+b.w-4,yy,1);
  }
  ctx.globalAlpha=.75;
  // windows
  for(let xx=b.x+16; xx<b.x+b.w-18; xx+=48){
    const wh=Math.min(34,b.h-18);
    ctx.strokeRect(xx,b.y+9,26,wh);
    roughLine(xx+13,b.y+9,xx+13,b.y+9+wh,1.2);
    roughLine(xx,b.y+9+wh/2,xx+26,b.y+9+wh/2,1.2);
  }
  hatchRect(b.x,b.y,b.w,b.h,16,.65);
  ctx.restore();
}
function drawCrate(q){
  ctx.save(); ctx.strokeStyle='#163b82'; ctx.fillStyle='#fff'; ctx.lineWidth=3;
  ctx.fillRect(q.x,q.y,q.w,q.h); ctx.strokeRect(q.x,q.y,q.w,q.h);
  roughLine(q.x,q.y,q.x+q.w,q.y+q.h,2);
  roughLine(q.x+q.w,q.y,q.x,q.y+q.h,2);
  roughLine(q.x+8,q.y+q.h-12,q.x+q.w-8,q.y+12,1.4,.65);
  ctx.font='bold 18px Arial'; ctx.fillStyle='#163b82'; ctx.textAlign='center';
  ctx.fillText('X',q.x+q.w/2,q.y+q.h/2+6);
  ctx.restore();
}
function drawTower(){
  ctx.save(); ctx.strokeStyle='#163b82'; ctx.fillStyle='#fff';
  ctx.lineWidth=3;
  // legs
  roughLine(1180,590,1202,395,3); roughLine(1285,590,1262,395,3);
  roughLine(1202,395,1262,395,3); roughLine(1188,530,1276,530,2);
  // cross braces
  roughLine(1185,575,1280,505,1.5); roughLine(1278,575,1190,505,1.5);
  roughLine(1194,510,1274,450,1.5); roughLine(1270,510,1200,450,1.5);
  // platform
  ctx.strokeRect(1180,385,105,24);
  ctx.strokeRect(1196,350,73,35);
  roughLine(1196,350,1232,320,3); roughLine(1269,350,1232,320,3);
  // ladder
  for(let y=410;y<585;y+=20) roughLine(1218,y,1245,y,1.3);
  for(let y=410;y<585;y+=18) roughLine(1218,y,1245,y+18,1.1,.7);
  ctx.restore();
}
function drawArch(){
  ctx.save(); ctx.strokeStyle='#163b82'; ctx.fillStyle='#fff'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(585,420); ctx.lineTo(585,300);
  ctx.quadraticCurveTo(625,245,665,300); ctx.lineTo(665,420); ctx.stroke();
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(596,420); ctx.lineTo(596,305);
  ctx.quadraticCurveTo(625,267,654,305); ctx.lineTo(654,420); ctx.stroke();
  hatchRect(585,300,80,120,12,.55);
  ctx.restore();
}
function drawPalm(){
  ctx.save(); ctx.strokeStyle='#163b82'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(1085,535); ctx.bezierCurveTo(1090,485,1110,425,1115,370); ctx.stroke();
  ctx.lineWidth=2;
  for(let i=0;i<8;i++){
    const a=-1.35+i*.38;
    const ex=1115+Math.cos(a)*120, ey=370+Math.sin(a)*65;
    ctx.beginPath(); ctx.moveTo(1115,370);
    ctx.quadraticCurveTo(1115+Math.cos(a)*55,345+Math.sin(a)*45,ex,ey); ctx.stroke();
    for(let j=0;j<3;j++){
      const t=.45+j*.15, bx=1115+(ex-1115)*t, by=370+(ey-370)*t;
      roughLine(bx,by,bx-12,by+10,1,.65);
    }
  }
  // trunk hatching
  ctx.globalAlpha=.35; for(let y=400;y<525;y+=12) roughLine(1092,y,1115,y-4,1);
  ctx.restore();
}
function drawStreetDetails(){
  ctx.save(); ctx.strokeStyle='#163b82';
  ctx.globalAlpha=.32; ctx.lineWidth=1.2;
  for(let x=0;x<world.w;x+=45) roughLine(x,610,x+18,610,1);
  // road perspective marks
  for(let x=100;x<1500;x+=120){
    roughLine(x,645,x+45,645,1.2);
    roughLine(x+20,680,x+70,680,1.2);
  }
  ctx.globalAlpha=1;
  // barrels
  for(const [x,y] of [[480,555],[1340,470]]){
    ctx.beginPath(); ctx.ellipse(x,y,20,28,0,0,Math.PI*2); ctx.stroke();
    roughLine(x-20,y,x+20,y,1.4); roughLine(x-16,y-12,x+16,y-12,1.1);
    hatchRect(x-20,y-28,40,56,10,.5);
  }
  ctx.restore();
}
function drawWorld(){
  ctx.fillStyle='#fdfcf8'; ctx.fillRect(0,0,W,H);
  const scale=Math.min(W/900,H/620);
  // camera follows local player
  const viewW=W/scale, viewH=H/scale;
  const camX=Math.max(0,Math.min(world.w-viewW,me.x-viewW*.50));
  const camY=Math.max(0,Math.min(world.h-viewH,me.y-viewH*.52));
  const ox=(W-viewW*scale)/2, oy=(H-viewH*scale)/2;
  ctx.save(); ctx.translate(ox,oy); ctx.scale(scale,scale); ctx.translate(-camX,-camY);
  ctx.strokeStyle='#163b82'; ctx.fillStyle='#fdfcf8';

  // paper texture
  ctx.globalAlpha=.08;
  for(let x=camX-50;x<camX+viewW+50;x+=32) roughLine(x,camY,x,camY+viewH,1);
  for(let y=camY-50;y<camY+viewH+50;y+=32) roughLine(camX,y,camX+viewW,y,1);
  ctx.globalAlpha=1;

  // broad street
  ctx.fillStyle='rgba(22,59,130,.035)';
  ctx.fillRect(0,570,world.w,105);
  ctx.strokeStyle='#163b82';

  // background buildings
  const buildings=[
    {x:25,y:80,w:260,h:180},{x:350,y:70,w:245,h:205},
    {x:710,y:75,w:285,h:180},{x:1080,y:65,w:300,h:205},
    {x:1380,y:95,w:190,h:175}
  ];
  buildings.forEach(sketchBuilding);

  // tactical walls
  for(const b of walls){
    ctx.save(); ctx.fillStyle='#fff'; ctx.lineWidth=3;
    ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeRect(b.x,b.y,b.w,b.h);
    hatchRect(b.x,b.y,b.w,b.h,14,.6);
    ctx.restore();
  }

  crates.forEach(drawCrate);
  drawTower(); drawArch(); drawPalm(); drawStreetDetails();

  // Zone A
  ctx.save(); ctx.setLineDash([10,8]); ctx.lineWidth=3; ctx.beginPath();
  ctx.arc(800,500,130,0,Math.PI*2); ctx.stroke(); ctx.restore();
  ctx.font='bold 44px Arial'; ctx.fillStyle='#163b82'; ctx.fillText('A',782,515);
  ctx.font='bold 16px Arial'; ctx.fillText('ZONA',770,538);

  ctx.restore();
  return {scale,camX,camY,ox,oy};
}
function screenPos(x,y,t){return [t.ox+(x-t.camX)*t.scale,t.oy+(y-t.camY)*t.scale]}

function drawSoldier(p,local,t){
  const [sx,sy]=screenPos(p.x,p.y,t),s=t.scale, a=p.angle||0;
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(a);
  ctx.strokeStyle='#102f70'; ctx.fillStyle='#fff'; ctx.lineCap='round'; ctx.lineJoin='round';

  // shadow
  ctx.globalAlpha=.16; ctx.beginPath(); ctx.ellipse(-2*s,18*s,25*s,9*s,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;

  // legs / boots
  ctx.lineWidth=4*s;
  roughLine(-8*s,10*s,-15*s,31*s,4*s);
  roughLine(7*s,10*s,15*s,31*s,4*s);
  ctx.lineWidth=5*s; roughLine(-18*s,31*s,-7*s,31*s,5*s); roughLine(7*s,31*s,19*s,31*s,5*s);

  // backpack
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(-20*s,-8*s,14*s,27*s,3*s); ctx.fill(); ctx.stroke();
  ctx.lineWidth=2*s; roughLine(-17*s,-3*s,-10*s,-3*s,2*s); roughLine(-17*s,4*s,-10*s,4*s,2*s);

  // torso vest
  ctx.beginPath(); ctx.moveTo(-14*s,-15*s); ctx.lineTo(-11*s,10*s);
  ctx.quadraticCurveTo(0,17*s,11*s,10*s); ctx.lineTo(14*s,-15*s);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // vest plates and straps
  ctx.lineWidth=2*s;
  roughLine(-10*s,-7*s,10*s,-7*s,2*s); roughLine(-8*s,1*s,8*s,1*s,2*s);
  roughLine(-8*s,-14*s,-2*s,10*s,2*s); roughLine(8*s,-14*s,2*s,10*s,2*s);
  // arms
  ctx.lineWidth=5*s; roughLine(-11*s,-10*s,-21*s,2*s,5*s); roughLine(11*s,-10*s,19*s,1*s,5*s);

  // helmet/head
  ctx.fillStyle='#fff'; ctx.lineWidth=3*s;
  ctx.beginPath(); ctx.arc(0,-27*s,10*s,Math.PI,Math.PI*2); ctx.lineTo(10*s,-23*s);
  ctx.quadraticCurveTo(0,-18*s,-10*s,-23*s); ctx.closePath(); ctx.fill(); ctx.stroke();
  roughLine(-10*s,-24*s,11*s,-24*s,3*s);
  // headset
  ctx.lineWidth=2*s; ctx.beginPath(); ctx.arc(0,-26*s,12*s,.2*Math.PI,.8*Math.PI); ctx.stroke();

  // rifle with stock, receiver, barrel and sight
  ctx.lineWidth=4*s; roughLine(8*s,-4*s,33*s,-4*s,4*s);
  ctx.lineWidth=3*s; roughLine(28*s,-5*s,50*s,-5*s,3*s);
  ctx.lineWidth=2*s; roughLine(18*s,1*s,28*s,9*s,2*s);
  roughLine(31*s,-8*s,38*s,-8*s,2*s);
  // muzzle
  ctx.lineWidth=2*s; roughLine(49*s,-8*s,49*s,-2*s,2*s);
  // weapon hatching
  ctx.globalAlpha=.5; for(let i=0;i<4;i++) roughLine((20+i*6)*s,-8*s,(25+i*6)*s,-1*s,1*s); ctx.globalAlpha=1;

  // local player marker
  if(local){ctx.lineWidth=2*s;ctx.setLineDash([5*s,4*s]);ctx.beginPath();ctx.arc(0,0,31*s,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}

  ctx.restore();

  // name + HP
  ctx.fillStyle='#163b82'; ctx.font='bold 12px Arial'; ctx.textAlign='center';
  ctx.fillText((local?'TÚ · ':'')+p.name,sx,sy-48);
  ctx.fillStyle='#fff'; ctx.strokeStyle='#163b82'; ctx.lineWidth=2;
  ctx.fillRect(sx-28,sy-40,56,6); ctx.strokeRect(sx-28,sy-40,56,6);
  ctx.fillStyle='#163b82'; ctx.fillRect(sx-28,sy-40,56*Math.max(0,p.hp/100),6);
}
function drawEnemy(p,t){
  drawSoldier({...p,name:p.name||'ENEMIGO'},false,t);
}
function draw(){
  const t=drawWorld();
  for(const p of players.values()) if(p.id!==me.id) drawEnemy(p,t);
  drawSoldier({...me,name:profile?.name||'TÚ'},true,t);
  mx.clearRect(0,0,145,120);
  mx.fillStyle='#fdfcf8'; mx.fillRect(0,0,145,120);
  mx.strokeStyle='#163b82'; mx.lineWidth=2; mx.strokeRect(1,1,143,118);
  const sx=145/world.w,sy=120/world.h;
  // minimap structures
  for(const b of walls){mx.strokeRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy)}
  for(const q of crates){mx.strokeRect(q.x*sx,q.y*sy,q.w*sx,q.h*sy)}
  for(const p of players.values()){
    mx.beginPath(); mx.arc(p.x*sx,p.y*sy,3.5,0,Math.PI*2);
    if(p.id===me.id){mx.fillStyle='#163b82';mx.fill()} else mx.stroke();
  }
  mx.strokeStyle='#163b82'; mx.setLineDash([3,3]); mx.beginPath();
  mx.arc(800*sx,500*sy,18,0,Math.PI*2); mx.stroke(); mx.setLineDash([]);
  requestAnimationFrame(draw);
}
draw();

function blocked(x,y,r=18){
  const solids=[...walls,...crates];
  return solids.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h);
}
function updateMove(){
 const speed=3.2;
 let dx=stick.x+keys.right-keys.left,dy=stick.y+keys.down-keys.up;
 const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}
 const nx=Math.max(35,Math.min(world.w-35,me.x+dx*speed));
 const ny=Math.max(145,Math.min(world.h-30,me.y+dy*speed));
 if(!blocked(nx,me.y,16)) me.x=nx;
 if(!blocked(me.x,ny,16)) me.y=ny;
 if(dx||dy) me.angle=Math.atan2(dy,dx);
 socket.emit('state',me);
 requestAnimationFrame(updateMove);
}
updateMove();

function nearestTarget(){
 let best=null,bd=1e9;
 for(const p of players.values()){if(p.id===me.id||p.hp<=0)continue;const dx=p.x-me.x,dy=p.y-me.y,d=Math.hypot(dx,dy);if(d<bd&&d<330){best=p;bd=d}}
 return best;
}
function shoot(){if(ammo<=0)return;ammo--;const p=nearestTarget();if(p)socket.emit('shoot',{targetId:p.id});}
setInterval(()=>{if(firing)shoot()},150);

socket.on('profile',p=>{profile=p;document.getElementById('pname').textContent=p.name;renderProfile()});
socket.on('spawn',p=>{
  // Use the exact spawn chosen by the server; never fall back to (800,500).
  me={...me,...p};
  players.set(p.id,p);
  renderPlayers();
});
socket.on('players',arr=>{players.clear();arr.forEach(p=>players.set(p.id,p));renderPlayers()});
socket.on('playerState',p=>{if(p.id!==me.id)players.set(p.id,p)});
socket.on('hit',h=>{if(h.target===me.id)me.hp=h.hp;const p=players.get(h.target);if(p)p.hp=h.hp});
socket.on('elimination',e=>addMsg('SISTEMA',e.killer+' eliminó a '+e.victim));
socket.on('chat',m=>addMsg(m.name,m.text));
socket.on('system',m=>addMsg('SISTEMA',m));

function renderProfile(){if(!profile)return;lvl.textContent=profile.level;xp.textContent=profile.xp;kills.textContent=profile.kills;wins.textContent=profile.wins;xpbar.style.width=Math.max(5,profile.xp/(profile.level*100)*100)+'%'}
function renderPlayers(){plist.innerHTML='';for(const p of players.values()){const d=document.createElement('div');d.className='row';d.innerHTML='<span>◆</span><span style="min-width:60px">'+p.name+'</span><div class="hp"><i style="width:'+p.hp+'%"></i></div>';plist.appendChild(d)}}
function addMsg(n,t){const d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+esc(n)+':</b> '+esc(t);messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
send.onclick=()=>{if(chatinput.value.trim()){socket.emit('chat',chatinput.value);chatinput.value='';chatinput.focus()}}
chatinput.onkeydown=e=>{if(e.key==='Enter')send.click()};

function bindButton(el,down,up=()=>{}){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down()});el.addEventListener('pointerup',e=>{e.preventDefault();up()});el.addEventListener('pointercancel',up)}
bindButton(fire,()=>firing=true,()=>firing=false);
reload.addEventListener('pointerdown',()=>{ammo=30});
aim.addEventListener('pointerdown',()=>{const p=nearestTarget();if(p)me.angle=Math.atan2(p.y-me.y,p.x-me.x)});
dash.addEventListener('pointerdown',()=>{me.x=Math.max(35,Math.min(world.w-35,me.x+Math.cos(me.angle)*85));me.y=Math.max(145,Math.min(world.h-30,me.y+Math.sin(me.angle)*85))});

let joyActive=false;
joyEl.addEventListener('pointerdown',e=>{joyActive=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(joyActive)moveJoy(e)});
joyEl.addEventListener('pointerup',()=>{joyActive=false;stick.x=stick.y=0;knob.style.left='41px';knob.style.top='41px'});
function moveJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,m=r.width*.38;const l=Math.hypot(x,y);if(l>m){x=x/l*m;y=y/l*m}stick.x=x/m;stick.y=y/m;knob.style.left=(r.width/2-31+x)+'px';knob.style.top=(r.height/2-31+y)+'px'}

let joinTimer=null;
function setStatus(t){statusEl.textContent=t}
function showRetry(v){retryBtn.style.display=v?'block':'none'}

socket.on('connect',()=>{setStatus('CONECTADO. Introduce tu nombre y entra.');showRetry(false)});
socket.on('connect_error',()=>{setStatus('ERROR DE CONEXIÓN — REINTENTAR');showRetry(true)});
socket.on('disconnect',()=>{if(login.style.display!=='none'){setStatus('CONECTANDO...');showRetry(false)}});
retryBtn.onclick=()=>{setStatus('CONECTANDO...');showRetry(false);socket.connect()};

// La transición real al mapa ocurre aquí: cuando el servidor confirma JOIN ROOM,
// no en cuanto se pulsa el botón (así nunca se "cuelga" en falso ni se abre en falso).
socket.on('room',()=>{
 if(joinTimer){clearTimeout(joinTimer);joinTimer=null}
 login.style.display='none';
});

start.onclick=()=>{
 const n=nameInput.value.trim()||'Player';
 let id=localStorage.getItem('tl_id');
 if(!id){id=crypto.randomUUID();localStorage.setItem('tl_id',id)}
 setStatus('ENTRANDO EN PARTIDA...');
 showRetry(false);
 socket.emit('login',{id,name:n});
 if(joinTimer)clearTimeout(joinTimer);
 joinTimer=setTimeout(()=>{setStatus('ERROR DE CONEXIÓN — REINTENTAR');showRetry(true)},6000);
};
</script>
</body>
